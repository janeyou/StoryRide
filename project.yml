name: StoryRide
options:
  bundleIdPrefix: com.janeyou
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    from: "10.0.0"

targets:
  StoryRide:
    type: application
    platform: iOS
    sources:
      - Models
      - Resources
      - Services
      - Utilities
      - Views
      - StoryRideApp.swift
    configFiles:
      Debug: Resources/Secrets.xcconfig
      Release: Resources/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janeyou.storyride
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_DropboxAppKey: $(DROPBOX_APP_KEY)
    dependencies:
      - package: SwiftyDropbox
        product: SwiftyDropbox
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: StoryRide
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - db-$(DROPBOX_APP_KEY)
            CFBundleURLName: "com.janeyou.storyride.oauth"
        DropboxAppKey: $(DROPBOX_APP_KEY)
        LSApplicationQueriesSchemes:
          - dbapi-2
          - dbapi-8-emm
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
